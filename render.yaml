services:
  - type: web
    name: telegram-ai-bot-v2
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: DEFAULT_MODEL
        sync: false
      - key: AVAILABLE_MODELS
        sync: false
      - key: DATABASE_PATH
        value: data/bot.db
      - key: WEBHOOK_PATH
        value: /telegram/webhook
      - key: DEFAULT_TIMEZONE
        value: Asia/Shanghai
      - key: DEFAULT_AUTO_TIME
        value: "23:00"
      - key: IDLE_NUDGE_MINUTES
        value: "15"
